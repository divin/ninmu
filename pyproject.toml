[project]
name = "ninmu"
version = "1.0.0"
description = "Self-hosted MCP server exposing a focused tool set for Vikunja tasks and NoteDiscovery notes"
readme = "README.md"
authors = [
    { name = "divin", email = "71128266+divin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ninmu = "ninmu:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.18.0",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
